[package]
name = "gmd-uploader-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.33", features = ["full"] }
reqwest = { version = "0.11" }
base64 = "0.21"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
roxmltree = "0.18"
rpassword = "7.3"